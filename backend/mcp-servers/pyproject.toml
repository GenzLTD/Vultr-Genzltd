# Looma MCP Servers (FastMCP via official mcp package)
# Python >= 3.11 required (joserfc dual-resolve); install: pip install "mcp>=1.20,<2"
[project]
name = "looma-mcp-servers"
version = "0.1.0"
description = "FastMCP Sidecar: rag / match_jobs / parse_resume tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
# Optional: only needed if running local Chroma client in-process.
# Production uses compose service `chromadb/chroma` (looma-chromadb); do not stop that container for this change.
chromadb = ["chromadb>=0.5.0"]

[tool.setuptools]
py-modules = []
