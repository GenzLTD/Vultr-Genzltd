# circle.genz.ltd — 海外 Host 片段（期望态，默认不进现行 nginx.conf）
#
# 契约：contracts/gfcc/circle.v1.json（围坐容器，不是聊天室）。
# 路径：/circle/ ；邀请 ?i= 是 16 位兑换码，不是 JWT。
# 上游：本机回环 127.0.0.1:5211（kernel 尚未进本仓 compose；解开本片段前必须先有进程）。
#
# 收进真机的唯一合法路径：某次 stack-v* 把下面的 include 从注释解开，
# 并在 RELEASE.json 写 circle.enabled=true。禁止手改 /etc/nginx/nginx.conf。
#
# 现网 DNS 仍可能指天翼；未切 DNS、未接 kernel 时不要解开。

# map 须放在 http{}（本文件若被 include 进 http{}，map 要先于 server）。
# map $request_uri $circle_uri_redacted {
#     ~^(.*[?&]i=)[^&]*(.*)$ $1REDACTED$2;
#     default $request_uri;
# }

server {
    listen 80;
    server_name circle.genz.ltd;

    # Cloudflare Flexible 与 api/tspace 同口径：公网 80。D1（Full + 443）另 tag。

    location = /circle {
        return 301 /circle/;
    }

    location /circle/ {
        proxy_pass http://127.0.0.1:5211;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 302 /circle/;
    }
}
