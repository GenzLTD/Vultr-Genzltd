# circle.genz.ltd — 海外 Host 片段（已由 circle 生产化 tag 收进现行 nginx.conf）
#
# 契约：contracts/gfcc/circle.v1.json（围坐容器，不是聊天室）。
# 路径：/circle/ ；邀请 ?i= 是 16 位兑换码，不是 JWT。
# 上游：本机回环 127.0.0.1:5211（kernel 已在基座 compose/docker-compose.yml）。
#
# 收进真机的唯一合法路径：stack-v* 把 include 解开（deploy.yml reload 前断言
# kernel /health 200 且 ETHOS_AUTH_SECRET 非空），并在 RELEASE.json 写
# circle.enabled=true。禁止手改 /etc/nginx/nginx.conf。
# DNS 切 circle.genz.ltd → 本机是本机健康绿之后的人工动作。

# map 须放在 http{}（本文件若被 include 进 http{}，map 要先于 server）。
# map $request_uri $circle_uri_redacted {
#     ~^(.*[?&]i=)[^&]*(.*)$ $1REDACTED$2;
#     default $request_uri;
# }

server {
    listen 80;
    server_name circle.genz.ltd;

    # Cloudflare Flexible 与 api/tspace 同口径：公网 80。D1（Full + 443）另 tag。

    location = /circle {
        return 301 /circle/;
    }

    location /circle/ {
        proxy_pass http://127.0.0.1:5211;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 302 /circle/;
    }
}
