# 本机 ServBay 旁路演示（18080/18081/18082）。不是生产 nginx/nginx.conf。
# 不得绑 80/443。server_name 仅用于本机 Host 仿真。
worker_processes 1;
error_log logs/error.log warn;
pid nginx.pid;

events {
    worker_connections 256;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;

    upstream looma_backend {
        server 127.0.0.1:5200;
    }

    # 对应生产 genz.ltd 官网（genz-web SPA）
    server {
        listen 18080;
        server_name genz.ltd www.genz.ltd _;

        location = /hub.html {
            root www;
        }

        location = /api-health {
            proxy_pass http://looma_backend/health;
            proxy_set_header Host api.genz.ltd;
            add_header Access-Control-Allow-Origin *;
        }

        location /health {
            proxy_pass http://looma_backend/health;
            proxy_set_header Host api.genz.ltd;
            access_log off;
        }

        location /v1/ {
            proxy_pass http://looma_backend;
            proxy_set_header Host api.genz.ltd;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            root www/genz-web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # 对应生产 api.genz.ltd
    server {
        listen 18081;
        server_name api.genz.ltd api.genz.local _;

        location /health {
            proxy_pass http://looma_backend/health;
            proxy_set_header Host api.genz.ltd;
            access_log off;
        }

        location /v1/auth/ {
            proxy_pass http://looma_backend;
            proxy_set_header Host api.genz.ltd;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /v1/ {
            proxy_pass http://looma_backend;
            proxy_set_header Host api.genz.ltd;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Use /v1/ endpoints"}';
        }
    }

    # 对应生产 tspace.genz.ltd（静态根 = 真机 /var/www/saas/dist）
    server {
        listen 18082;
        server_name tspace.genz.ltd tspace.genz.local _;

        location /health {
            proxy_pass http://looma_backend/health;
            proxy_set_header Host api.genz.ltd;
            access_log off;
        }

        location /v1/ {
            proxy_pass http://looma_backend;
            proxy_set_header Host tspace.genz.ltd;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 本地演示关掉 PWA SW，避免旧 stub/半截缓存把 /login 打回未登录壳
        location = /sw.js { return 404; }
        location = /registerSW.js { return 404; }

        location / {
            root www/tspace;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
