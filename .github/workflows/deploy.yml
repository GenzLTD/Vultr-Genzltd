# =============================================================
# Vultr-Genzltd — 三门禁并行 → 单点扇入部署
#
#   旧 overseas 管线的骨架是对的，本文件把它搬过来，并改掉第 3 步的源：
#     compose / nginx / 契约 只从本仓取期望态，不再 rsync looma-zervi
#     （那边的 compose 仍是 0.0.0.0，nginx 是产品仓历史件）。
#
#   git tag stack-vX.Y.Z（或 workflow_dispatch）
#           │  concurrency: 门禁按 ref 隔离(stack-gates-<ref>) / 部署全局串行(deploy-stack)
#           ├──────────────┬──────────────┬──────────────┐
#           ▼              ▼              ▼
#     backend-test     saas-build    contract-gate
#     pytest+契约+干跑  pnpm tspace    前端 bundle ↔ 后端 url_map
#           └──────┬───────┴──────────────┘
#              needs: [backend-test, saas-build, contract-gate]
#              if: 三项全绿 且 DEPLOY_ENABLED 且（tag 或 dispatch 非 dry_run）
#                  ▼
#               deploy  8 步串行
#
#   部署门已开：vars.DEPLOY_ENABLED 已由 looma-zervi 海外部署 CI 有意置为 true，
#   故 push tag stack-v* 即真实部署到 Vultr SG（见 vars.DEPLOY_HOST），且无审批拦截。
#   旧注「现在还不能打 tag 部署 / overseas-* rsync 可能盖回 0.0.0.0 / 禁止打开」
#   系旧项目残留，已不适用（2026-10-11 澄清）。
#   tspace 源码已在 frontend/packages/saas，saas-build 会打出同源 artifact。
#
#   发版纪律：先 push 分支，再单独 push tag，避免 Actions 列表双记录。
# =============================================================
name: Deploy stack

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅跑双门禁（不 SSH、不碰真机）。部署另需 DEPLOY_ENABLED。'
        type: boolean
        default: true
  # tag 触发不得加 paths：否则「只改契约/文档的 tag」会被滤掉。
  # 分支 push 会跑双门禁但不进 deploy。发版请先 push 分支、再单独 push tag。
  push:
    branches: [main]
    tags:
      - 'stack-v*'
  pull_request:

permissions:
  contents: read

# 门禁按 ref 隔离，部署全局串行 —— 两层，不要合成一层。
#
#   旧写法 group: deploy-stack / cancel-in-progress: true 是 workflow 级，
#   所有 ref（每个 PR / main push / 每个 tag）**共用同一组**，于是并发到达
#   的运行会被直接掐掉，结论记成 cancelled。实测已被取消 4 次：
#     38136335211 / 38136502323（merge #3 / #8 后的 main push）
#     38136455654（PR #8）、38141436239（workflow_dispatch）
#   PR 门禁被取消尤其危险 —— 看起来"跑过了"，实际没有任何断言执行过。
#
#   按 ref 隔离后各 PR 互不干扰。但**部署不能跟着一起隔离**：两个 tag 并发
#   会得到两次并行部署，中途互相覆盖 → 留下半套栈。所以 deploy job 单独用
#   一个全局组，且 cancel-in-progress: false（排队等待，不打断进行中的部署）。
concurrency:
  group: stack-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/looma-zervi
  STACK_DIR: /opt/vultr-genzltd-stack

jobs:
  # ---------------------------------------------------------------
  # 门禁 A：后端（与 saas-build 并行，互不依赖）
  # ---------------------------------------------------------------
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 契约层
        run: bash scripts/assert-contracts.sh

      - name: 干跑（本仓期望态，无 SSH）
        run: bash scripts/dryrun.sh --static

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: pytest（内存库）
        working-directory: backend
        env:
          DATABASE_PATH: ":memory:"
          JWT_SECRET: ci-test-secret
          WECHAT_DEV_MODE: "true"
          WECHAT_APPID: test_appid
          WECHAT_SECRET: test_secret
          DEEPSEEK_API_KEY: skip
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          CHROMA_PERSIST_DIR: /tmp/chroma_ci
          DEPLOY_REGION: SG
        run: python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------
  # 门禁 B：前端产物（与 backend-test 并行）
  #   dist 必须来自本 tag 的同一 commit；deploy 第一步下载，禁止现找。
  # ---------------------------------------------------------------
  saas-build:
    name: saas-build
    runs-on: ubuntu-latest
    outputs:
      has_dist: ${{ steps.dist.outputs.has_dist }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build tspace（同源 /v1，SG）
        id: dist
        working-directory: frontend
        env:
          VITE_API_BASE: ""
          VITE_DEPLOY_REGION: SG
        run: |
          set -euo pipefail
          test -f packages/saas/package.json
          pnpm install --frozen-lockfile
          pnpm --filter @looma/saas build
          test -f packages/saas/dist/index.html
          echo "has_dist=true" >> "$GITHUB_OUTPUT"

      - name: Upload saas-dist
        uses: actions/upload-artifact@v4
        with:
          name: saas-dist
          path: frontend/packages/saas/dist
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 门禁 C：前端契约（与 backend-test / saas-build 并行）
  #
  #   拿**即将发布的后端** url_map（本仓 checkout 的代码 dump 出来，
  #   不是线上 api.genz.ltd 的当前版本），去对**当前线上**的前端 bundle。
  #
  #   只有一种情况判失败：前端 bundle 里实际调用了、但即将发布的后端
  #   里没有的 /v1/* —— 那意味着这次发布会把线上正在用的接口删掉。
  #
  #   后端多出来、前端没用到的路径是正常增量（新增能力前端还没接），
  #   只报告，不计失败。
  #
  #   app.genz.ltd 的前端不在这个仓里（见 frontend/SOURCE.json），
  #   所以它只能验线上产物；这正是要卡住的漂移。
  # ---------------------------------------------------------------
  contract-gate:
    name: contract-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dump 即将发布的后端路由（本仓 url_map，非线上）
        working-directory: backend
        env:
          DATABASE_PATH: ":memory:"
          JWT_SECRET: ci-test-secret
          WECHAT_DEV_MODE: "true"
          WECHAT_APPID: test_appid
          WECHAT_SECRET: test_secret
          DEEPSEEK_API_KEY: skip
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          CHROMA_PERSIST_DIR: /tmp/chroma_ci
          DEPLOY_REGION: SG
        run: |
          set -euo pipefail
          PYTHONPATH=. python ../scripts/dump-backend-endpoints.py > /tmp/backend-endpoints.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/backend-endpoints.json'))
          n = len(d.get('rules') or [])
          if n == 0:
              raise SystemExit('::error::dump 出 0 条规则 —— 门禁失效，必须修')
          print(f"即将发布的后端规则 {n} 条（env={d.get('env')}）")
          PY

      - name: 校验线上前端 bundle 调用的 /v1/* 是否都在其中
        run: |
          set -euo pipefail
          python scripts/check-frontend-contract.py \
            --endpoints-file /tmp/backend-endpoints.json \
            --site https://tspace.genz.ltd \
            --site https://app.genz.ltd

  # ---------------------------------------------------------------
  # 扇入：三项必须全绿。现网收款在跑 → 默认根本不进这个 job。
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to Vultr SG
    runs-on: ubuntu-latest
    # 部署全局串行且**不可取消**：两个 tag 若并行执行会互相覆盖，留下半套栈；
    # 所以这里刻意不按 ref 隔离（与上面的门禁组相反），排队而非取消。
    concurrency:
      group: deploy-stack
      cancel-in-progress: false
    needs: [backend-test, saas-build, contract-gate]
    environment: production
    if: >-
      always()
      && needs.backend-test.result == 'success'
      && needs.saas-build.result == 'success'
      && needs.contract-gate.result == 'success'
      && needs.saas-build.outputs.has_dist == 'true'
      && vars.DEPLOY_ENABLED == 'true'
      && (
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/stack-v'))
           || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
         )
    env:
      SSH_HOST: ${{ vars.DEPLOY_HOST || secrets.VULTR_SSH_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER || secrets.VULTR_SSH_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: "1 下载 saas-dist artifact（同 tag 同源前端）"
        uses: actions/download-artifact@v4
        with:
          name: saas-dist
          path: artifacts/saas

      - name: 校验 SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "${{ env.SSH_HOST }}" ]; then
            echo "::error::缺少 SSH_PRIVATE_KEY / DEPLOY_HOST"
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY || secrets.VULTR_SSH_PRIVATE_KEY }}

      - name: known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts
          echo 'SSH_CMD=ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes -o BatchMode=yes' >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=${{ env.SSH_USER }}@${{ env.SSH_HOST }}" >> "$GITHUB_ENV"

      - name: "2 Bootstrap：set_kv 每轮对齐 + seed_kv 密钥不覆盖"
        env:
          JWT_SECRET: ${{ secrets.VULTR_JWT_SECRET || secrets.ENV_JWT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.VULTR_DEEPSEEK_API_KEY || secrets.ENV_DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ENV_OPENAI_API_KEY }}
          QCC_AUTH_TOKEN: ${{ secrets.VULTR_QCC_AUTH_TOKEN || secrets.ENV_QCC_AUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.ENV_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.ENV_GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.ENV_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.ENV_STRIPE_WEBHOOK_SECRET }}
          QCC_MCP_BASE_URL: ${{ vars.QCC_MCP_BASE_URL }}
        run: |
          set -euo pipefail
          $SSH_CMD "$DEPLOY_TARGET" "mkdir -p $STACK_DIR/scripts"
          scp -o BatchMode=yes scripts/env-kv.sh scripts/bootstrap-env.sh \
            "$DEPLOY_TARGET:$STACK_DIR/scripts/"
          $SSH_CMD "$DEPLOY_TARGET" \
            "DEPLOY_PATH=$DEPLOY_PATH STACK_DIR=$STACK_DIR ENV_FILE=$DEPLOY_PATH/backend/.env \
             JWT_SECRET='$JWT_SECRET' DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' \
             OPENAI_API_KEY='$OPENAI_API_KEY' QCC_AUTH_TOKEN='$QCC_AUTH_TOKEN' \
             GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' GOOGLE_CLIENT_SECRET='$GOOGLE_CLIENT_SECRET' \
             STRIPE_SECRET_KEY='$STRIPE_SECRET_KEY' STRIPE_WEBHOOK_SECRET='$STRIPE_WEBHOOK_SECRET' \
             QCC_MCP_BASE_URL='$QCC_MCP_BASE_URL' \
             bash $STACK_DIR/scripts/bootstrap-env.sh"

      - name: "3 rsync 本仓期望态 → STACK_DIR/releases/<tag>（不 --delete 现网 /opt）"
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            stack-v*) ;;
            *) TAG="sha-${GITHUB_SHA:0:12}" ;;
          esac
          REL="$STACK_DIR/releases/$TAG"
          $SSH_CMD "$DEPLOY_TARGET" "mkdir -p $REL $DEPLOY_PATH/docker $DEPLOY_PATH/backend $STACK_DIR/backups"
          # 3a 不可变快照（本仓整树，不含密钥）
          rsync -avz -e "$SSH_CMD" \
            --exclude='.git' \
            --exclude='local/' \
            --exclude='dryrun/' \
            --exclude='node_modules' \
            --exclude='**/__pycache__' \
            --exclude='**/*.pyc' \
            --exclude='backend/.env' \
            --exclude='*.env' \
            ./ \
            "$DEPLOY_TARGET:$REL/"
          $SSH_CMD "$DEPLOY_TARGET" "ln -sfn $REL $STACK_DIR/current && echo $TAG $GITHUB_SHA \$(date -u +%Y-%m-%dT%H:%M:%SZ) > $STACK_DIR/CURRENT_RELEASE"
          $SSH_CMD "$DEPLOY_TARGET" "cp $DEPLOY_PATH/docker/docker-compose.yml $STACK_DIR/backups/docker-compose.yml.\$(date +%Y%m%d-%H%M%S) || true"
          rsync -avz -e "$SSH_CMD" docker/ "$DEPLOY_TARGET:$DEPLOY_PATH/docker/"
          rsync -avz -e "$SSH_CMD" compose/docker-compose.yml \
            "$DEPLOY_TARGET:$DEPLOY_PATH/docker/docker-compose.yml"
          rsync -avz -e "$SSH_CMD" \
            --exclude='.env' --exclude='**/__pycache__' \
            backend/ "$DEPLOY_TARGET:$DEPLOY_PATH/backend/"
          echo "compose/nginx 源 = 本仓（127.0.0.1:5200 + 无裸域），不是 looma-zervi"

      - name: "4 rsync poetry 数据（仓里有才投）"
        run: |
          if [ -d data/poetry_full ] && [ "$(find data/poetry_full -type f ! -name '.gitkeep' | wc -l)" -gt 0 ]; then
            rsync -avz -e "$SSH_CMD" data/poetry_full/ \
              "$DEPLOY_TARGET:$DEPLOY_PATH/data/poetry_full/"
          else
            echo "仓内无 poetry 数据，沿用服务器副本"
          fi

      - name: "5 rsync 前端 → /var/www/saas/dist（--delete 原子覆盖）"
        run: |
          rsync -avz -e "$SSH_CMD" --delete \
            artifacts/saas/ \
            "$DEPLOY_TARGET:/var/www/saas/dist/"
          $SSH_CMD "$DEPLOY_TARGET" "find /var/www/saas/dist -type f | wc -l"

      - name: "6 nginx：本仓 nginx/nginx.conf → /etc；-t 过了才 reload（不停 80/443）"
        run: |
          $SSH_CMD "$DEPLOY_TARGET" "bash -s" << NGINX
          set -euo pipefail
          SRC="$STACK_DIR/current/nginx/nginx.conf"
          if [ ! -f "\$SRC" ]; then
            echo "REFUSE: 缺少 \$SRC（必须是本仓 nginx/nginx.conf）" >&2
            exit 1
          fi
          cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak-\$(date +%Y%m%d-%H%M%S) || true
          cp "\$SRC" /etc/nginx/nginx.conf.new
          nginx -t -c /etc/nginx/nginx.conf.new
          mv /etc/nginx/nginx.conf.new /etc/nginx/nginx.conf
          # 进化：现网收款在跑，禁止 stop/kill 80/443。语法门禁保留，动作用 reload。
          if systemctl is-active --quiet nginx; then
            systemctl reload nginx
          else
            systemctl start nginx
          fi
          systemctl is-active --quiet nginx
          echo "nginx reloaded from \$SRC"
          NGINX

      - name: "7 Docker：git_commit 先写；hash marker 决定是否重建；不 down 整栈"
        run: |
          $SSH_CMD "$DEPLOY_TARGET" "bash -s" << DOCKER
          set -euo pipefail
          DEPLOY_PATH="$DEPLOY_PATH"
          COMPOSE="docker compose --env-file \${DEPLOY_PATH}/backend/.env -f \${DEPLOY_PATH}/docker/docker-compose.yml -p looma-zervi"
          docker compose --env-file \${DEPLOY_PATH}/backend/.env -f \${DEPLOY_PATH}/docker/docker-compose.yml -p looma-zervi config | grep -q 'DEPLOY_REGION: SG' \
            || { echo 'REFUSE: DEPLOY_REGION 插值不是 SG'; exit 1; }

          HASH=\$(sha256sum \${DEPLOY_PATH}/backend/requirements.txt \${DEPLOY_PATH}/docker/Dockerfile.backend | sha256sum | awk '{print \$1}')
          MARKER=/tmp/looma-backend-image.hash
          NEED_BUILD=1
          if [ -f "\$MARKER" ] && [ "\$(cat "\$MARKER")" = "\$HASH" ]; then
            if docker image inspect looma-zervi-backend:latest >/dev/null 2>&1; then
              NEED_BUILD=0
              echo "=== 镜像 hash 未变，跳过 15 分钟重建 ==="
            fi
          fi
          if [ "\$NEED_BUILD" = "1" ]; then
            echo "=== Build backend image (pypi.org) ==="
            DOCKER_BUILDKIT=1 \$COMPOSE build --build-arg PIP_INDEX_URL=https://pypi.org/simple backend
            echo "\$HASH" > "\$MARKER"
          fi

          echo "=== git_commit 必须在容器启动前写入 ==="
          echo "${{ github.sha }}" > "\${DEPLOY_PATH}/backend/git_commit.txt"
          cat "\${DEPLOY_PATH}/backend/git_commit.txt"

          # 进化：现网收款在跑，禁止 compose down 整栈（redis/chroma 有状态）。
          \$COMPOSE up -d --remove-orphans --no-build backend redis chromadb

          b="\$(docker port looma-backend 5200/tcp 2>/dev/null | head -1)"
          [ "\$b" = "127.0.0.1:5200" ] || { echo "REFUSE backend 端口 \$b"; exit 1; }
          echo "=== 端口收内网 OK \$b ==="
          DOCKER

      - name: "8a 本机健康（5200 + Host api.genz.ltd）"
        run: |
          $SSH_CMD "$DEPLOY_TARGET" "bash $STACK_DIR/current/scripts/healthcheck.sh"

      - name: "8b 公网健康（只断言本管线：api + tspace；不替 Vercel 背书）"
        run: |
          set -euo pipefail
          echo "=== https://api.genz.ltd/health ==="
          curl -sf --connect-timeout 20 "https://api.genz.ltd/health"
          echo
          echo "=== api 业务探针：membership 蓝图已注册（免鉴权）==="
          curl -sf --connect-timeout 20 -o /dev/null "https://api.genz.ltd/v1/membership/plans" \
            || { echo "::error::api /v1/membership/plans 未应答——业务可能未随本次发布注册"; exit 1; }
          echo "=== tspace 同源 login 代理 ==="
          curl -sf --connect-timeout 20 -X POST "https://tspace.genz.ltd/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"beta_free@looma.test","password":"looma123"}' | head -c 80
          echo
          echo "=== tspace /register CTA ==="
          REG_CODE=$(curl -sS -o /tmp/tspace-register.html -w '%{http_code}' --connect-timeout 20 \
            "https://tspace.genz.ltd/register")
          echo "HTTP ${REG_CODE}"
          [ "${REG_CODE}" = "200" ] || { echo "::error::tspace /register 期望 200"; exit 1; }

      - name: 失败回滚（分层：服务死 → 恢复 compose；服务活但冒烟失败 → 回滚代码）
        if: failure()
        run: |
          $SSH_CMD "$DEPLOY_TARGET" "STACK_DIR=$STACK_DIR DEPLOY_PATH=$DEPLOY_PATH bash -s" << 'REMOTE'
          set -u
          if curl -sf -m 5 http://127.0.0.1:5200/health >/dev/null 2>&1; then
            echo "=== /health 仍活着 → 判定为业务冒烟失败：只回滚代码，不动 compose ==="
            echo "（恢复 compose 历史备份会用旧文件把 backend 端口重新暴露为 0.0.0.0:5200，故不这么做）"
            bash "$STACK_DIR/current/scripts/rollback-release.sh" --apply || {
              echo "::error::代码回滚失败，需人工介入：bash scripts/rollback-tag.sh <tag>"; exit 1; }
            echo "=== 回滚后复检 ==="
            bash "$STACK_DIR/current/scripts/healthcheck.sh" || {
              echo "::error::回滚后复检仍失败，需人工介入"; exit 1; }
            echo "已回滚代码到上一个 release，并通过复检"
            exit 0
          fi
          echo "=== /health 已死 → 恢复 compose 备份（服务已不可用时优先恢复）==="
          LAST="$(ls -1 "${STACK_DIR}"/backups/docker-compose.yml.* 2>/dev/null | tail -1)"
          [ -n "${LAST}" ] || { echo "无备份"; exit 1; }
          cp "${LAST}" "${DEPLOY_PATH}/docker/docker-compose.yml"
          docker compose --env-file "${DEPLOY_PATH}/backend/.env" \
            -f "${DEPLOY_PATH}/docker/docker-compose.yml" -p looma-zervi \
            up -d --no-build --remove-orphans backend redis chromadb
          echo "已回滚 compose 到 ${LAST}"
          REMOTE
