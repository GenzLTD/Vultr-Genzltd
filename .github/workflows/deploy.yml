# =============================================================
# Vultr-Genzltd — 部署栈 CI
#
#   铁律（与 Owner 约定一致）：**本地/CI 干跑通过，才允许动真机**。
#   因此本工作流的默认行为是「只干跑」，且部署被双重门禁锁死：
#
#     push / PR             → 只跑 dryrun（无 SSH，不碰真机）
#     workflow_dispatch
#         dry_run=true  (默认) → 只跑 dryrun
#         dry_run=false        → 还要 vars.DEPLOY_ENABLED == 'true'
#                                 + environment: production 审批，才可能部署
#
#   需要配置的参数见 README「生产机」一节。clone 本地干跑不需要 Secrets。
#
#   启用部署前必读 docs/LIVE-FORENSICS-2026-09-18.md：在 looma-zervi 的
#   overseas-* rsync 停掉之前，把本仓 compose 投到 /opt/looma-zervi/docker/
#   会被静默盖回 0.0.0.0。DEPLOY_ENABLED 在那之前不要打开。
#   本地 clone 以本仓 compose/ nginx/ backend/ docker/ 为准，不要去借 looma-zervi。
#
#   已证「收内网不会崩」的三条链路（实测）：
#     · 宿主 nginx upstream looma_backend = 127.0.0.1:5200 → 收内网不影响回源
#     · backend/redis/chromadb 三容器同在 looma-zervi_looma-net → 撤端口发布不断服
#     · compose 首行 `name: looma-zervi` → 无论从哪个目录调用都是同一 project
# =============================================================
name: Vultr-Genzltd stack

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅干跑校验（不投递、不重启、不碰真机）'
        type: boolean
        default: true
      apply_nginx:
        description: '同时应用 nginx 配置（需 nginx/nginx.conf 有变更；默认关闭）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['compose/**', 'nginx/**', 'scripts/**', 'backend/**', 'docker/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['compose/**', 'nginx/**', 'scripts/**', 'backend/**', 'docker/**', '.github/workflows/deploy.yml']

permissions:
  contents: read

concurrency:
  group: vultr-genzltd-stack
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/looma-zervi          # 现役 compose 所在；looma-zervi 的流水线也在管这里
  STACK_DIR: /opt/vultr-genzltd-stack    # 本仓自有目录，与 looma-zervi 部署树隔离

jobs:
  # ---------------------------------------------------------------
  # 1) 干跑：纯校验，无 SSH，绝不可能碰到真机
  # ---------------------------------------------------------------
  dryrun:
    name: 干跑校验（无 SSH）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        run: |
          docker --version
          docker compose version
          python3 --version

      - name: 六步断言
        # 说明：--static 跳过第 6 步「回环绑定运行时实证」（需要真实网卡，
        # 在开发机本地执行）。CI 以其余五步为门禁：布局组装 / compose 语法 /
        # 端口收内网断言 / nginx -t / 基线指纹与精确 diff。
        run: bash scripts/dryrun.sh --static

      - name: 变更集摘要
        if: always()
        run: |
          echo "### 变更集 vs 现网基线" >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          diff -u baseline/docker-compose.yml compose/docker-compose.yml >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # 2) 投递：三重门禁（dry_run=false + DEPLOY_ENABLED=true + 环境审批）
  # ---------------------------------------------------------------
  deploy:
    name: 投递到真机
    needs: dryrun
    # vars.DEPLOY_ENABLED 是安全硬开关：解决完与 looma-zervi 流水线的双写冲突
    # （README §七）之前，不要把它设为 'true'。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production          # 建议在 Settings → Environments 配 Required reviewers
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          echo "::add-mask::${{ vars.DEPLOY_HOST }}"

      - name: 投递部署契约（compose + scripts）
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          OPT="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          TARGET="$USER@$HOST"

          # 备份现网 compose 到本仓自有目录（留在对方树里会被 rsync --delete 清掉）
          ssh $OPT "$TARGET" "mkdir -p $STACK_DIR/backups && cp $DEPLOY_PATH/docker/docker-compose.yml $STACK_DIR/backups/docker-compose.yml.\$(date +%Y%m%d-%H%M%S)" || true

          scp $OPT compose/docker-compose.yml "$TARGET:$DEPLOY_PATH/docker/docker-compose.yml"

          # 脚本放独立目录，不写进 /opt/looma-zervi
          ssh $OPT "$TARGET" "mkdir -p $STACK_DIR/scripts"
          scp $OPT scripts/*.sh "$TARGET:$STACK_DIR/scripts/"

      - name: .env 仅首次种入（已存在则跳过，永不覆盖）
        # 兜底层：scripts/seed-env.sh 永不覆盖；防发版回滚线上密钥。
        # 上游 looma-zervi 仓 deploy-overseas.yml 若仍 set_kv 全键覆盖，
        # 本 seed-only 仍能把"被覆盖的密钥"挡在 .env 外。
        # 根治见 proposals/looma-zervi-set_kv-seed-only.md（上游 PR 提案，未提交）。
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "ENV_FILE=$DEPLOY_PATH/backend/.env bash $STACK_DIR/scripts/seed-env.sh"

      - name: 插值断言（防 DEPLOY_REGION 被兜成 US）
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          # 必须与 looma-zervi 流水线共用同一插值源：缺 --env-file 时
          # ${DEPLOY_REGION:-US} 会把 SG 覆盖成 US（真实支付在跑，禁止漂移）。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "docker compose --env-file $DEPLOY_PATH/backend/.env -f $DEPLOY_PATH/docker/docker-compose.yml -p looma-zervi config | grep -q 'DEPLOY_REGION: SG' || { echo 'REFUSE: DEPLOY_REGION 插值不是 SG，拒绝重建'; exit 1; }"

      - name: 重建容器（对齐 looma-zervi 的调用方式）
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "docker compose --env-file $DEPLOY_PATH/backend/.env -f $DEPLOY_PATH/docker/docker-compose.yml -p looma-zervi up -d --no-build --remove-orphans backend redis chromadb"

      - name: 端口收敛断言（服务端权威：P0 即部署终态）
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          # 口径（Owner 2026-09-18）：端口「公开/收内网」由部署流程掌控，
          # 每次部署的终态都必须是「收内网」。权威判据取自 docker，不依赖 runner 网络。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "bash -s" <<'REMOTE'
          set -u
          echo "--- 端口矩阵 ---"
          docker ps --format '{{.Names}}  {{.Ports}}' | grep -E 'looma-(backend|redis|chromadb)' || true
          ok=1
          b="$(docker port looma-backend 5200/tcp 2>/dev/null | head -1)"
          if [ "$b" = "127.0.0.1:5200" ]; then echo "backend   OK   ${b}"; else echo "REFUSE backend 期望 127.0.0.1:5200，实为 [${b}]"; ok=0; fi
          for pair in looma-redis:6379 looma-chromadb:8000; do
            c="${pair%%:*}"; p="${pair##*:}"
            out="$(docker port "$c" "$p/tcp" 2>/dev/null | head -1)"
            if [ -z "$out" ]; then echo "${c}   OK   无宿主端口"; else echo "REFUSE ${c} 仍在发布 [${out}]"; ok=0; fi
          done
          [ "$ok" = "1" ] || { echo "端口未收敛，拒绝判定部署成功"; exit 1; }
          REMOTE

      - name: 公网不可达断言（独立于服务端自证）
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          # 从公网独立复核：三个端口都必须打不通（closed / filtered 皆算通过）。
          fail=0
          for p in 5200 6379 8000; do
            if timeout 6 bash -c "echo > /dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "REFUSE: 公网仍可连 $HOST:$p"
              fail=1
            else
              echo "OK: 公网不可达 $HOST:$p"
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: 应用 nginx（仅勾选 apply_nginx 时；test 后 reload，绝不停服）
        if: ${{ inputs.apply_nginx == true }}
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          # P0 不改 nginx。覆盖前先备份 /etc 现网文件，避免丢掉手工改动或证书路径调整。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak-\$(date +%Y%m%d-%H%M%S) \
             && cp $DEPLOY_PATH/docker/nginx.conf /etc/nginx/nginx.conf.new \
             && nginx -t -c /etc/nginx/nginx.conf.new \
             && mv /etc/nginx/nginx.conf.new /etc/nginx/nginx.conf \
             && systemctl reload nginx && echo nginx-reloaded"

      - name: 健康门禁（退出码即结论）
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "bash $STACK_DIR/scripts/healthcheck.sh"

      - name: 失败即回滚（仅服务不健康时；端口断言失败刻意不回滚）
        if: failure()
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "STACK_DIR=$STACK_DIR DEPLOY_PATH=$DEPLOY_PATH bash -s" <<'REMOTE'
          set -u
          if curl -sf -m 5 http://127.0.0.1:5200/health >/dev/null 2>&1; then
            echo "服务在跑 -> 判定为前置/端口断言失败，不回滚"
            echo "（回滚只会把 5200/6379/8000 重新暴露到公网，风险更高）"
            exit 1
          fi
          LAST="$(ls -1 "${STACK_DIR}"/backups/docker-compose.yml.* 2>/dev/null | tail -1)"
          if [ -z "${LAST}" ]; then echo "无备份可回滚"; exit 1; fi
          cp "${LAST}" "${DEPLOY_PATH}/docker/docker-compose.yml"
          docker compose --env-file "${DEPLOY_PATH}/backend/.env" \
            -f "${DEPLOY_PATH}/docker/docker-compose.yml" -p looma-zervi \
            up -d --no-build --remove-orphans backend redis chromadb
          echo "已回滚到 ${LAST}（注意：端口恢复公网可达，属止血态，须立刻处理）"
          REMOTE
