# =============================================================
# 法兰克福预发。不打 tag，不进新加坡。
#
#   触发只有 workflow_dispatch。stack-v* 仍由 deploy.yml 送到 vars.DEPLOY_HOST。
#   dry_run 默认 true。即使关掉，还要 vars.STAGING_DEPLOY_ENABLED=true 才 SSH。
#
#   这次联调在预发机上要落地的：
#     1. /opt/src/Vultr-Genzltd 检出切到本工作流的提交
#     2. contracts/gfcc 换成 gfcc_ref 那一提交的字节，SOURCE.json 钉着该提交
#        一步钉到 L0 1.5.0 + 信号 1.1.0（4f0dc4b，含 job_match / value_axis_choice）。
#        同一提交带上支付契约 1.3.0。这是消费者钉，不在服务器上改协议字段。
#     3. 按该检出重建并只重启 tatha（127.0.0.1:5210）
#     4. 空的 pgvector，库名 gfcc，只绑 127.0.0.1:5434
#
#   本工作流明确不装、也不该装的：
#     - zervi-rust。网关由 Win 或 Mac 仿真，经 nginx 或到 127.0.0.1:5210 的隧道。
#     - /opt/looma-zervi 与 looma-backend / redis / chromadb。容器 id 变了就失败。
#     - stack-v*、新加坡 139.180.184.25、api.genz.ltd。
#
#   跑完仍缺、YAML 补不上的：
#     - services/tatha（当前起步树 c665677）没有 memory.recall，不读 X-Actor-Sub。
#       重建镜像不会长出这条路由。OpenAPI 没有 recall 时本工作流打 warning，不假装已经接上。
#     - zervi-rust 244b07f 只转发 sha256 的 X-User-Id，没有 X-Actor-Sub。
#       原样 sub 要等从 244b07f 拉出的后续分支，不在这次预发部署里。
#
#   真跑之前要有：
#     vars.STAGING_DEPLOY_HOST、vars.STAGING_DEPLOY_ENABLED=true
#     vars.STAGING_DEPLOY_USER（可空，默认 root）
#     secrets.STAGING_SSH_PRIVATE_KEY、secrets.STAGING_GFCC_DB_PASSWORD
#     secrets.GFCC_READ_TOKEN：GenzLTD/gfcc 是私有仓，本仓 GITHUB_TOKEN 读不到
# =============================================================
name: Staging Frankfurt

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true：只钉契约并校验，不 SSH。false 仍要 STAGING_DEPLOY_ENABLED=true 才上法兰克福。'
        type: boolean
        default: true
      gfcc_ref:
        description: 'GenzLTD/gfcc 的完整提交。契约字节只从这一提交拷贝。'
        required: true
        default: '4f0dc4ba5c15861fbe56e0ad63e762003b80bf62'
        type: string

permissions:
  contents: read

concurrency:
  group: staging-frankfurt
  cancel-in-progress: false

jobs:
  pin:
    name: 钉 GFCC 1.5.0
    runs-on: ubuntu-latest
    outputs:
      gfcc_sha: ${{ steps.vendor.outputs.gfcc_sha }}
    steps:
      - uses: actions/checkout@v4

      # 这一步要真打一次 API，不能只判断「token 非空」。
      # 只查非空时，token 无效/权限不足会一路滑到 checkout，报一句
      # remote: Write access to repository not granted（403），看不出到底哪一环错。
      - name: 确认能读私有真源（真打 API，区分 401/403/404）
        env:
          TOKEN: ${{ secrets.GFCC_READ_TOKEN }}
          GFCC_REF: ${{ inputs.gfcc_ref }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::secrets.GFCC_READ_TOKEN 为空。GenzLTD/gfcc 是私有仓，本仓 GITHUB_TOKEN 读不到它。"
            exit 1
          fi
          code="$(curl -sS -o /tmp/gfcc.json -D /tmp/gfcc.hdr -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/GenzLTD/gfcc || true)"
          code="${code:-000}"
          echo "GET /repos/GenzLTD/gfcc -> HTTP $code"
          grep -iE '^(x-oauth-scopes|x-accepted-github-permissions|x-github-sso|x-ratelimit-remaining):' /tmp/gfcc.hdr | sed 's/^/  /' || true
          case "$code" in
            200)
              echo "token 可读 gfcc ✓"
              ;;
            401)
              echo "::error::HTTP 401：token 无效、已过期或已被撤销。重新铸一把（fine-grained，Resource owner=GenzLTD，只勾 GenzLTD/gfcc，Contents: Read-only）再 gh secret set GFCC_READ_TOKEN -R GenzLTD/Vultr-Genzltd。"
              exit 1
              ;;
            403)
              echo "::error::HTTP 403：token 有效但被拒。看上面响应头——有 X-GitHub-SSO 就点该链接做 SSO 授权；有 X-Accepted-GitHub-Permissions 则说明缺对应权限（至少要 contents=read）。"
              exit 1
              ;;
            404)
              pinned="$(python3 -c 'import json; print(json.load(open("contracts/gfcc/SOURCE.json", encoding="utf-8"))["commit"])')"
              if [ "$pinned" = "$GFCC_REF" ]; then
                echo "::warning::HTTP 404：GFCC_READ_TOKEN 看不到 GenzLTD/gfcc。本提交 SOURCE.json 已钉 $pinned，用仓内契约字节继续门禁，不再拉取真源。"
                touch /tmp/gfcc-use-vendored
              else
                echo "::error::HTTP 404：token 看不到这个仓，且仓内钉 $pinned 不是 $GFCC_REF。fine-grained token 的 Resource owner 要选 GenzLTD（不是个人），Repository access 要显式勾上 GenzLTD/gfcc。"
                exit 1
              fi
              ;;
            *)
              echo "::error::HTTP $code：非预期状态。"
              head -c 400 /tmp/gfcc.json || true
              exit 1
              ;;
          esac

      # 不用 actions/checkout 拉 gfcc：它对 fine-grained PAT 的注入路径不稳，
      # 失败时统一报「Write access to repository not granted」，且会 fallback 到
      # 本仓 GITHUB_TOKEN。这里用显式 extraheader，凭据只存在于命令参数，
      # 不写进 .git/config，也不进日志。
      - name: 拉取 gfcc 指定提交
        env:
          TOKEN: ${{ secrets.GFCC_READ_TOKEN }}
          REF: ${{ inputs.gfcc_ref }}
        run: |
          set -euo pipefail
          if [ -f /tmp/gfcc-use-vendored ]; then
            echo "跳过拉取：GFCC_READ_TOKEN 返回 404，仓内钉已是 $REF"
            exit 0
          fi
          rm -rf gfcc-src && mkdir -p gfcc-src && cd gfcc-src
          git init -q .
          git remote add origin https://github.com/GenzLTD/gfcc
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch --depth=1 --no-tags origin "$REF"
          git checkout -q --detach FETCH_HEAD
          echo "gfcc HEAD = $(git rev-parse HEAD)（期望 $REF）"
          test -d contracts || { echo "::error::gfcc 检出里没有 contracts/"; exit 1; }

      - name: 从真源拷贝契约字节
        id: vendor
        env:
          GFCC_REF: ${{ inputs.gfcc_ref }}
        run: |
          set -euo pipefail
          if [ -f /tmp/gfcc-use-vendored ]; then
            python3 -c 'import json,os,sys; pin=json.load(open("contracts/gfcc/SOURCE.json",encoding="utf-8")); ref=os.environ["GFCC_REF"]; sys.exit("FAIL: 仓内钉 %s 不是 %s"%(pin.get("commit"), ref)) if pin.get("commit")!=ref else None; out=open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8"); out.write("gfcc_sha=%s\nl0_version=%s\nsignal_version=%s\n"%(pin["commit"], pin["families"]["l0"]["version"], pin["families"]["signal"]["version"])); print("OK vendored pin", pin["commit"], pin["families"]["l0"]["version"], pin["families"]["signal"]["version"])'
            exit 0
          fi
          bash scripts/vendor-gfcc-pin.sh gfcc-src contracts/gfcc
          echo "gfcc_sha=$(git -C gfcc-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,os; pin=json.load(open("contracts/gfcc/SOURCE.json",encoding="utf-8")); out=open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8"); out.write("l0_version=%s\nsignal_version=%s\n"%(pin["families"]["l0"]["version"], pin["families"]["signal"]["version"]))'

      - name: 契约层门禁
        run: bash scripts/assert-contracts.sh

      - name: 打包预发包（不含密钥、不含 zervi-rust）
        run: |
          set -euo pipefail
          mkdir -p staging-bundle
          cp -a contracts/gfcc staging-bundle/contracts-gfcc
          cp compose/docker-compose.frankfurt.yml staging-bundle/docker-compose.frankfurt.yml
          cp scripts/staging-frankfurt-remote.sh staging-bundle/staging-frankfurt-remote.sh
          # memory.recall 的存储结构。预发库是已 initdb 的卷，initdb.d 不会再跑，
          # 所以这份 SQL 由远端脚本每次显式执行（幂等）。
          cp compose/sql/gfcc-memory-v1.sql staging-bundle/gfcc-memory-v1.sql
          test -f staging-bundle/contracts-gfcc/memory.v1.json
          test -f staging-bundle/contracts-gfcc/SOURCE.json
          test -f staging-bundle/gfcc-memory-v1.sql

      - uses: actions/upload-artifact@v4
        with:
          name: frankfurt-staging
          path: staging-bundle
          retention-days: 1
          if-no-files-found: error

      - name: 这次预发做到哪、还缺什么
        run: |
          echo "契约钉来自 gfcc ${{ steps.vendor.outputs.gfcc_sha }}，L0 ${{ steps.vendor.outputs.l0_version }}，信号 ${{ steps.vendor.outputs.signal_version }}。不打 stack-v*。"
          echo "zervi-rust 不部署。Win 或 Mac 仿真网关，经 nginx 或隧道访问 127.0.0.1:5210。"
          echo "Tatha 侧已接 memory.recall：/v1/ask + context.port_hint=memory，只读 X-Actor-Sub（原始 claims.sub）。"
          echo "memory 存储结构由本次流水线显式迁移（compose/sql/gfcc-memory-v1.sql），不依赖 initdb.d。"
          echo "仍未接：remember（需 participant，本次不授予）；网关尚不注入 X-Actor-Sub，M0 由 curl 带头发起。"

  require-deploy-config:
    name: dry_run=false 时配置必须齐
    runs-on: ubuntu-latest
    needs: pin
    if: >-
      github.repository == 'GenzLTD/Vultr-Genzltd'
      && inputs.dry_run == false
    steps:
      - name: 缺一项就失败，避免 deploy 被静默跳过
        env:
          ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          PW: ${{ secrets.STAGING_GFCC_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ "$ENABLED" = "true" ] || missing="$missing STAGING_DEPLOY_ENABLED"
          [ -n "$HOST" ] || missing="$missing STAGING_DEPLOY_HOST"
          [ -n "$KEY" ] || missing="$missing STAGING_SSH_PRIVATE_KEY"
          [ -n "$PW" ] || missing="$missing STAGING_GFCC_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::dry_run=false 但缺少:$missing"
            exit 1
          fi

  deploy:
    name: 部署到法兰克福
    runs-on: ubuntu-latest
    needs: [pin, require-deploy-config]
    environment: staging
    if: >-
      github.repository == 'GenzLTD/Vultr-Genzltd'
      && inputs.dry_run == false
      && vars.STAGING_DEPLOY_ENABLED == 'true'
    env:
      SSH_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
      SSH_USER: ${{ vars.STAGING_DEPLOY_USER || 'root' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frankfurt-staging
          path: staging-bundle

      - name: 拒绝新加坡
        env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::缺少 STAGING_SSH_PRIVATE_KEY 或 STAGING_DEPLOY_HOST"
            exit 1
          fi
          case "$SSH_HOST" in
            139.180.184.25|api.genz.ltd)
              echo "::error::STAGING_DEPLOY_HOST 指向新加坡，本工作流拒绝"
              exit 1
              ;;
          esac
          if [ -n "$PROD_HOST" ] && [ "$SSH_HOST" = "$PROD_HOST" ]; then
            echo "::error::STAGING_DEPLOY_HOST 与生产 DEPLOY_HOST 相同"
            exit 1
          fi

      - name: 拒绝空密码或会破坏 compose 的密码
        env:
          PW: ${{ secrets.STAGING_GFCC_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from urllib.parse import quote

          pw = os.environ.get("PW", "")
          if not pw or any(ch in pw for ch in "$'\"\n\r\t "):
              sys.exit("缺少 STAGING_GFCC_DB_PASSWORD，或密码含空格、$、引号")

          # 密码只经 quote 进 DSN：@ : / ? # 这类会破坏连接串的字符一律编码，
          # 不依赖「密码恰好是 hex」这种约定。
          dsn = "postgresql://gfcc:{}@gfcc-pgvector:5432/gfcc".format(quote(pw, safe=""))
          path = os.path.join(os.environ["RUNNER_TEMP"], "gfcc.env")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as f:
              f.write(f"GFCC_DB_PASSWORD={pw}\nGFCC_DB_DSN={dsn}\n")
          PY

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo 'SSH_CMD=ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes -o BatchMode=yes' >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=${SSH_USER}@${SSH_HOST}" >> "$GITHUB_ENV"

      - name: 上传预发包与库密码
        run: |
          set -euo pipefail
          $SSH_CMD "$DEPLOY_TARGET" "mkdir -p /tmp/staging-frankfurt"
          rsync -avz -e "$SSH_CMD" staging-bundle/ "$DEPLOY_TARGET:/tmp/staging-frankfurt/"
          scp -o BatchMode=yes "$RUNNER_TEMP/gfcc.env" "$DEPLOY_TARGET:/opt/src/Vultr-Genzltd/.staging-gfcc.env"
          $SSH_CMD "$DEPLOY_TARGET" "chmod 600 /opt/src/Vultr-Genzltd/.staging-gfcc.env /tmp/staging-frankfurt/staging-frankfurt-remote.sh"
          rm -f "$RUNNER_TEMP/gfcc.env"

      - name: 检出、钉契约、只重建 tatha 与 gfcc 库
        env:
          GFCC_SHA: ${{ needs.pin.outputs.gfcc_sha }}
        run: |
          set -euo pipefail
          $SSH_CMD "$DEPLOY_TARGET" "VULTR_SHA='${{ github.sha }}' GFCC_SHA='$GFCC_SHA' bash /tmp/staging-frankfurt/staging-frankfurt-remote.sh"
