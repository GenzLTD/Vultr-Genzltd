# 法兰克福预发附加服务。生产 .github/workflows/deploy.yml 不引用本文件。
# 与 compose/docker-compose.yml 一起用，项目名仍是 looma-zervi：
#   docker compose --env-file .staging-gfcc.env \
#     -f compose/docker-compose.yml -f compose/docker-compose.frankfurt.yml \
#     -p looma-zervi up -d gfcc-pgvector
#
# 本文件不改 tatha 的 environment。覆盖 environment 列表会冲掉
# TATHA_USE_LLM_INTENT=false。记忆库 URL 等 Tatha 源码读 actor_sub 时再加。
#
# 库名 gfcc。卷第一次创建是空库（empty_on_boot）。不建 adirp_*，不建 genzltd。
# 只绑 127.0.0.1。密码来自 GFCC_DB_PASSWORD，不入库。

services:
  gfcc-pgvector:
    image: pgvector/pgvector:pg16
    container_name: gfcc-pgvector
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: gfcc
      POSTGRES_USER: gfcc
      POSTGRES_PASSWORD: ${GFCC_DB_PASSWORD:?set GFCC_DB_PASSWORD}
    volumes:
      - gfcc-pgvector-data:/var/lib/postgresql/data
    networks:
      - looma-net

  # gfcc kernel（circle :5211）。镜像由 remote.sh 从 /opt/src/gfcc（pinned SHA）构建，
  # tag 写进 .staging-gfcc.env 的 GFCC_KERNEL_IMAGE。存储是容器内 SQLite，落盘到卷：
  # 这就是这一刀的"迁移"——SQLiteStore / CircleFlowStore 建表是 CREATE TABLE IF NOT
  # EXISTS，容器首启即完成，没有 Postgres 迁移要跑。kernel 的 memory store 与 Tatha
  # 用的 PG memory_record 是两套存储，互不读。
  # ETHOS_AUTH_SECRET 留空 = stub 联调（与 5210 基线同口径）；LLM 槽 stub，不依赖 Ollama。
  # 只绑 127.0.0.1，nginx include 未解，公网不可达。
  gfcc-kernel:
    image: ${GFCC_KERNEL_IMAGE:?set GFCC_KERNEL_IMAGE in .staging-gfcc.env}
    container_name: gfcc-kernel
    restart: unless-stopped
    ports:
      - "127.0.0.1:5211:5211"
    environment:
      STORE_PROVIDER: sqlite
      STORE_DB_PATH: /app/data/memory.db
      CIRCLE_FLOW_PROVIDER: sqlite
      CIRCLE_FLOW_DB: /app/data/circle_flow.db
      ETHOS_AUTH_SECRET: ""
      ETHOS_AUDIT_DB: /app/logs/audit.db
      LLM_PROVIDER: stub
      CONSENSUS_THRESHOLD: "85"
    volumes:
      - gfcc-kernel-data:/app/data
      - gfcc-kernel-logs:/app/logs
    networks:
      - looma-net

volumes:
  gfcc-pgvector-data:
  gfcc-kernel-data:
  gfcc-kernel-logs:
