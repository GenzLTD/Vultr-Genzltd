name: looma-zervi

services:
  # ============================================
  # Looma Backend (Flask)
  # 镜像首次手动 docker compose build，后续 CI 只重启容器加载新代码
  # ============================================
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: looma-backend
    restart: unless-stopped
    ports:
      # 收内网：仅绑定宿主回环。宿主 nginx 的 upstream looma_backend 指向
      # 127.0.0.1:5200，故本改动不影响 nginx → backend 链路；
      # 公网不再能直连 5200 绕过 nginx 的限流与审计。
      - "127.0.0.1:5200:5200"
    environment:
      - FLASK_PORT=5200
      # Explicit CORS for SaaS hosts (also set via backend/.env; keep both in sync)
      - CORS_ORIGINS=${CORS_ORIGINS:-https://genz.ltd,https://www.genz.ltd,https://tspace.genz.ltd,https://api.genz.ltd,https://app.genz.ltd,https://tspace.szbolent.cn,http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # Overseas: Google OAuth + payment providers + rate limiting
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Stripe keys live in backend/.env (env_file). Do NOT list them under
      # environment: — compose interpolation of empty host vars would override
      # env_file with blank and silently disable overseas checkout.
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - AIRWALLEX_API_KEY=${AIRWALLEX_API_KEY:-}
      - AIRWALLEX_CLIENT_KEY=${AIRWALLEX_CLIENT_KEY:-}
      - AIRWALLEX_MODE=${AIRWALLEX_MODE:-demo}
      - AIRWALLEX_WEBHOOK_SECRET=${AIRWALLEX_WEBHOOK_SECRET:-}
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-memory://}
      # 海外仓默认 SG。:-US 会在宿主未导出时盖掉 backend/.env 的 SG。
      - DEPLOY_REGION=${DEPLOY_REGION:-SG}
      # QCC (企查查官方 MCP；2026-08-27 迁入 base，防 full.yml 重新生成丢配置。
      # 注意：compose environment 优先于 backend/.env，重新生成 full.yml 前
      # 必须确保插值源（docker/.env 或 shell）已配 QCC_ENABLED=true + QCC_AUTH_TOKEN)
      - QCC_ENABLED=${QCC_ENABLED:-false}
      - QCC_AUTH_TOKEN=${QCC_AUTH_TOKEN:-}
    env_file:
      - ../backend/.env
    volumes:
      # 代码 bind mount：rsync 后 restart 即生效，不需 rebuild
      - ../backend:/app
      - backend-data:/app/data
      - chroma-data:/app/chroma_data
      # 本地诗词向量库（宿主机 data/poetry_full → 容器内 /app/poetry_data）
      - ../data/poetry_full:/app/poetry_data:ro
      - ../data/chroma_models:/root/.cache/chroma/onnx_models
    depends_on:
      - redis
    networks:
      - looma-net

  # ============================================
  # ChromaDB (Vector Database)
  # ============================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: looma-chromadb
    restart: unless-stopped
    # 收内网：不发布宿主端口。backend 经 looma-net 以服务名 chromadb:8000 访问。
    # 原 "8000:8000" 等价 0.0.0.0 绑定，公网可达。
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - CHROMA_DB_IMPL=duckdb+parquet
      - PERSIST_DIRECTORY=/chroma/chroma
    networks:
      - looma-net

  # ============================================
  # Redis (overseas: rate limiting + cache)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: looma-redis
    restart: unless-stopped
    # 收内网：不发布宿主端口。原 "6379:6379" 等价 0.0.0.0 绑定，
    # 且 redis 无 requirepass → 公网可无认证读写（限流存储可被投毒/清空）。
    # backend 经 looma-net 以服务名 redis:6379 访问（RATE_LIMIT_STORAGE_URI）。
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - looma-net

  # ============================================
  # Tatha（人格测评海外运行时；起步树见 services/tatha/SOURCE.json）
  # 只在预发机使用；镜像本仓维护：docker/Dockerfile.tatha
  # ============================================
  tatha:
    build:
      context: ../services/tatha
      # dockerfile 相对 context 解析（context = <repo>/services/tatha，两层深），
      # 故需两级 ../ 才回到 <repo>/docker/。写成 ../docker/... 会被解析成
      # services/docker/Dockerfile.tatha 并在 build 时报 lstat no such file。
      dockerfile: ../../docker/Dockerfile.tatha
    container_name: tatha-mbti
    restart: unless-stopped
    ports:
      # 收内网：仅宿主回环。宿主 nginx default_server 反代 127.0.0.1:5210；
      # 公网不能直连 5210 绕过 nginx（Docker 会穿透 ufw）。
      - "127.0.0.1:5210:8010"
    environment:
      # 双保险之二（其一在 Dockerfile.tatha 写死）：意图解析走规则，不调 LLM
      - TATHA_USE_LLM_INTENT=false
      - TATHA_DEFAULT_MODEL=${TATHA_DEFAULT_MODEL:-openai/gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}  # 留空即不调 LLM，人格端点不受影响
      # memory 端口的 gfcc 库连接串。只在预发注入（预发 compose 用
      # --env-file .staging-gfcc.env 提供 GFCC_DB_DSN）；新加坡生产没有这个变量，
      # 解析为空串 ⇒ memory 端口返回 status=error 且不影响其余端点。
      # 注意：这是往既有 environment 列表**追加**一项，不改变上面三条已有变量。
      - GFCC_DB_DSN=${GFCC_DB_DSN:-}
    # 不用 env_file 引 services/tatha/.env：该桩只有两个空键且被上面 environment
    # 同名项覆盖（compose 规则 environment > env_file），是零效果配置；而生产机
    # rsync 带 --exclude='*.env' 且从不落 services/tatha/，env_file 会让
    # `docker compose config` 直接解析失败（stack-v0.1.7 部署实测）。
    # 将来真要给预发喂真值密钥，走 compose 插值（--env-file）或 environment 列表。
    networks:
      - looma-net

  # ============================================
  # gfcc kernel（circle :5211）
  # 2026-10-18 起进基座 compose：新加坡生产与法兰克福预发共用此定义。
  # 镜像由部署流水线按 contracts/gfcc/SOURCE.json 的 pin 从 /opt/src/gfcc
  # 构建（docker/Dockerfile.gfcc-kernel），并在**任何 docker compose 命令之前**
  # 把 GFCC_KERNEL_IMAGE 写进 --env-file —— compose 对全部服务插值，缺了连
  # build tatha 都会炸（预发 run 39081711926 的根因）。
  # 存储：容器内 SQLite 落盘到卷（CREATE TABLE IF NOT EXISTS 首启即建，
  # 无 Postgres 迁移）；kernel 的 memory store 与 Tatha 的 PG memory_record
  # 是两套存储，互不读。
  # ETHOS_AUTH_SECRET 留空 = stub 鉴权（假 JWT 可建圈）：法兰克福预发回环
  # 继续用 stub；新加坡公网开窗前由 deploy.yml 的 nginx 门禁强制非空。
  # ============================================
  gfcc-kernel:
    image: ${GFCC_KERNEL_IMAGE:?set GFCC_KERNEL_IMAGE (deploy 流水线按 SOURCE.json pin 构建后写入 env 文件)}
    container_name: gfcc-kernel
    restart: unless-stopped
    ports:
      # 收内网：仅宿主回环。circle.genz.ltd 的 nginx 片段反代 127.0.0.1:5211。
      - "127.0.0.1:5211:5211"
    environment:
      STORE_PROVIDER: sqlite
      STORE_DB_PATH: /app/data/memory.db
      CIRCLE_FLOW_PROVIDER: sqlite
      CIRCLE_FLOW_DB: /app/data/circle_flow.db
      ETHOS_AUTH_SECRET: ${ETHOS_AUTH_SECRET:-}
      ETHOS_AUDIT_DB: /app/logs/audit.db
      LLM_PROVIDER: stub
      CONSENSUS_THRESHOLD: "85"
    volumes:
      - gfcc-kernel-data:/app/data
      - gfcc-kernel-logs:/app/logs
    networks:
      - looma-net

volumes:
  backend-data:
  chroma-data:
  redis-data:
  gfcc-kernel-data:
  gfcc-kernel-logs:

networks:
  looma-net:
    driver: bridge
